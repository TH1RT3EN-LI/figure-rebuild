name: Core checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
        dependencies: ['requirements.txt', 'requirements-vision.txt', 'requirements-source.txt']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r ${{ matrix.dependencies }}
      - run: python -m unittest discover -s tests/figure_rebuild -v
      - run: python scripts/run.py --help
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/figure_rebuild/test_*.mjs
