name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
        extras: ['', 'vision', 'source']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and selected dependencies
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          if [ -n "$EXTRAS" ]; then
            python -m pip install -e ".[${EXTRAS}]"
          else
            python -m pip install -e .
          fi
      - run: python -m unittest discover -s tests -v
      - run: python -m figure_rebuild --help
      - run: python scripts/run.py --help
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_*.mjs
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_distribution.py --wheel dist/*.whl --sdist dist/*.tar.gz
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
